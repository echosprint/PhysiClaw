<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1eb">
<title>PhysiClaw Studio</title>
<style>
  :root {
    /* Warm paper neutrals with the terracotta brand accent — the same
       family as the hardware setup page's light theme. */
    --bg: #f4f1eb; --card: #ffffff; --card2: #f7f4ee;
    --line: #e7e1d7; --line2: #d7cfc2;
    --txt: #26211c; --muted: #6e675e; --faint: #a59d91;
    --accent: #d4511a; --accent-lt: #e8804f; --accent-ink: #fff6f0;
    --ok: #2f9e6a; --red: #c8483f; --blue: #5b86b3; --amber: #c98d1f;
    --screen: #ffffff; --screen-ink: #1a1714; --bezel: #1f1d22;
    --shadow: 0 10px 28px rgba(70, 50, 30, .10), 0 1px 2px rgba(70, 50, 30, .06);
    --phone-shadow: 0 18px 40px rgba(40, 30, 20, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a; --card: #212026; --card2: #292831;
      --line: #33323b; --line2: #413f4a;
      --txt: #efece7; --muted: #a6a199; --faint: #736e66;
      --ok: #4cc98a; --red: #e0685f; --blue: #7099c2; --amber: #e0a93f;
      --bezel: #0b0a0d;
      --shadow: 0 10px 28px rgba(0, 0, 0, .35);
      --phone-shadow: 0 18px 40px rgba(0, 0, 0, .55);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit; color: var(--txt); background: var(--card);
    border: 1px solid var(--line2); border-radius: 9px; padding: 6px 12px;
    cursor: pointer; white-space: nowrap; transition: border-color .12s, background .12s;
  }
  button:hover { border-color: var(--muted); background: var(--card2); }
  button:disabled { opacity: .38; cursor: default; }
  button:disabled:hover { border-color: var(--line2); background: var(--card); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { background: var(--accent-lt); border-color: var(--accent-lt); }
  input[type=text], select {
    font: inherit; color: var(--txt); background: var(--card);
    border: 1px solid var(--line2); border-radius: 9px; padding: 6px 9px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent-lt); }
  kbd {
    font: inherit; font-size: 10px; padding: 0 4px; border: 1px solid var(--line2);
    border-radius: 4px; color: var(--faint); background: var(--card2);
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; margin: 0 8px 0 0; }
  #conn { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-right: 10px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  #dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(47,158,106,.18); }
  #dot.busy { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  #clip { display: flex; gap: 6px; margin-left: auto; }
  #clip input { width: 230px; }
  #banner {
    display: none; padding: 7px 16px; background: #fbe9e6; color: #8f2f27;
    border-bottom: 1px solid #efc6c0; cursor: pointer;
  }

  /* ── Action bar: the line under the header, always present ── */
  #actbar {
    display: flex; align-items: center; gap: 8px; padding: 7px 16px;
    background: var(--card2); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  #actbar .cap { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 12px; max-width: 40%; }
  #actbar .cap b { color: var(--txt); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #actbar .cap span { white-space: nowrap; }
  #actbar.idle .cap { color: var(--faint); }
  #actbar kbd { margin-left: 6px; }
  #actbar .swipe-hint { color: var(--accent); font-size: 12px; white-space: nowrap; }
  #actbar button.armed { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  #actbar button.armed kbd { color: #f6d2c2; background: transparent; border-color: rgba(255,255,255,.35); }
  #actbar select { padding: 5px 7px; font-size: 12px; }
  #actbar .x { margin-left: auto; }

  /* ── Panes ── */
  main {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr 300px; gap: 14px;
    padding: 14px; min-height: 0; position: relative;
  }
  .pane {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .pane h2 {
    font-size: 13px; font-weight: 600; color: var(--txt); margin: 0; padding: 12px 16px 6px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .pane h2 .hint { color: var(--faint); font-weight: 400; font-size: 12px; }
  .pane h2 .count { margin-left: auto; color: var(--faint); font-weight: 400; font-size: 12px; }
  .stage {
    flex: 1; position: relative; margin: 6px 14px 16px; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  /* The phone: a dark bezel around the screen, both panes alike. */
  .device {
    display: none; padding: 9px; background: var(--bezel); border-radius: 30px;
    box-shadow: var(--phone-shadow);
  }
  .wrap { position: relative; cursor: crosshair; user-select: none; touch-action: none; }
  #frame { display: block; border-radius: 22px; -webkit-user-drag: none; user-select: none; pointer-events: none; }
  #virt { background: var(--screen); border-radius: 22px; overflow: hidden; }
  .empty { color: var(--faint); text-align: center; padding: 30px; line-height: 1.9; }

  /* Virtual screen elements — the OCR listing laid out as the screen
     would look: black text sized to its box, icons as soft tiles. */
  .el { position: absolute; pointer-events: none; overflow: hidden; }
  .el.text {
    color: var(--screen-ink); white-space: nowrap; display: flex; align-items: center;
    padding: 0 1px; font-family: -apple-system, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", system-ui, sans-serif;
  }
  .el.text span { display: inline-block; transform-origin: left center; }
  .el.text.faint { color: #8b857c; }
  /* An icon is a soft blank tile, the way an app icon looks before it
     loads: a faint gradient, no border, nothing drawn inside. */
  .el.icon {
    background: linear-gradient(145deg, #ece8e1, #ddd7cd);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.035);
  }
  /* A region the detector boxed (a header, a search bar, a card) is
     not a tile: a faint tint keeps the text inside legible. */
  .el.icon.region { background: rgba(0,0,0,.025); box-shadow: none; }

  /* Hover / selection overlays — one of each per pane, geometry-driven
     so the camera frame and the virtual screen highlight the same spot. */
  .hover, .sel, .drag { position: absolute; pointer-events: none; border-radius: 4px; display: none; }
  .hover { border: 1.5px solid var(--blue); background: rgba(91,134,179,.12); }
  .sel { border: 2px solid var(--accent); box-shadow: 0 0 0 3px rgba(212,81,26,.25); }
  .drag { border: 1.5px dashed var(--accent-lt); }
  /* The live swipe: an arrow from the box center, as long as the stroke
     the arm will make (the drag snaps to the served ladder). */
  .arrow {
    position: absolute; pointer-events: none; display: none; height: 3px;
    background: var(--accent); border-radius: 2px; transform-origin: 0 50%;
    box-shadow: 0 0 0 2px rgba(212,81,26,.25);
  }
  .arrow::after {
    content: ""; position: absolute; right: -2px; top: 50%; transform: translateY(-50%);
    border: 7px solid transparent; border-left: 12px solid var(--accent); border-right: 0;
  }
  .arrow-tag {
    position: absolute; pointer-events: none; display: none; padding: 3px 9px;
    background: var(--txt); color: var(--bg); border-radius: 7px; font-size: 12px;
    white-space: nowrap; transform: translate(-50%, -50%); box-shadow: var(--shadow);
  }

  /* ── Log ── */
  #log {
    flex: 1; overflow-y: auto; padding: 2px 16px 12px; min-height: 0;
    font-size: 12px; display: flex; flex-direction: column;
  }
  .entry {
    white-space: pre-wrap; word-break: break-word; color: var(--txt);
    padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .entry time { display: block; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .entry.err { color: var(--red); }
  .entry.dim { color: var(--muted); }

  #busy {
    display: none; position: absolute; inset: 14px; border-radius: 16px;
    background: rgba(244,241,235,.55); align-items: center; justify-content: center; z-index: 20;
  }
  @media (prefers-color-scheme: dark) { #busy { background: rgba(22,21,26,.55); } }
  #busy .box {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px;
    background: var(--card); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow);
  }
  .spin {
    width: 12px; height: 12px; border: 2px solid var(--line2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>PhysiClaw Studio</h1>
  <span id="conn"><span id="dot"></span><span id="conn-label">connecting…</span></span>
  <button class="primary" data-tool="peek" title="fresh camera look (P)">&#10227; Peek</button>
  <button data-tool="screenshot" title="the phone's own screenshot — pixel-perfect, but the app sees it">Screenshot</button>
  <span class="sep"></span>
  <button data-tool="home_screen" title="swipe up from the bottom">&#8962; Home</button>
  <button data-tool="go_back" title="left-edge swipe back">&#9665; Back</button>
  <button data-tool="unlock_phone" title="wake and enter the passcode">&#128275; Unlock</button>
  <button data-tool="force_quit" title="force-quit the front app">&#10005; Force quit</button>
  <form id="clip" title="copies to the phone's clipboard — then long-press a field and tap Paste">
    <input type="text" id="clip-text" placeholder="text to paste on the phone…">
    <button type="submit">Send to clipboard</button>
  </form>
</header>
<div id="actbar">
  <span class="cap"><b id="cap-label"></b><span id="cap-geo"></span></span>
  <button data-press="tap">Tap<kbd>T</kbd></button>
  <button data-press="double_tap">Double tap<kbd>D</kbd></button>
  <button data-press="long_press">Long press<kbd>L</kbd></button>
  <span class="sep"></span>
  <button id="swipe-btn" title="then drag on the screen — the drag is the stroke">Swipe<kbd>S</kbd></button>
  <span class="swipe-hint" id="swipe-hint"></span>
  <select id="swipe-speed" title="stroke speed"></select>
  <button class="x" id="cap-x" title="clear the selection (Esc)">&#10005; Clear</button>
</div>
<div id="banner" title="click to dismiss"></div>

<main>
  <section class="pane">
    <h2>Camera <span class="hint">click an element, or hold and drag a box</span></h2>
    <div class="stage">
      <div class="device"><div class="wrap" id="cam-wrap">
        <img id="frame" alt="camera frame" draggable="false">
        <div class="hover"></div><div class="sel"></div><div class="drag"></div>
        <div class="arrow"></div><div class="arrow-tag"></div>
      </div></div>
      <div class="empty" id="cam-empty">Looking at the phone…</div>
    </div>
  </section>
  <section class="pane">
    <h2>Screen <span class="hint">what the detector read</span><span class="count" id="count"></span></h2>
    <div class="stage">
      <div class="device"><div class="wrap" id="virt-wrap">
        <div id="virt"></div>
        <div class="hover"></div><div class="sel"></div><div class="drag"></div>
        <div class="arrow"></div><div class="arrow-tag"></div>
      </div></div>
      <div class="empty" id="virt-empty">
        Elements appear here after a look.<br>
        <kbd>T</kbd> tap · <kbd>D</kbd> double tap · <kbd>L</kbd> long press ·
        <kbd>S</kbd> swipe, then drag · <kbd>Esc</kbd> clear
      </div>
    </div>
  </section>
  <section class="pane">
    <h2>Log <span class="hint">newest first</span></h2>
    <div id="log"></div>
  </section>
  <div id="busy"><div class="box"><span class="spin"></span><span id="busy-what"></span></div></div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const state = {
  busy: false, rows: [],
  // The phone screen's width/height. Every bbox is a fraction of the
  // screen, so both panes are drawn at this shape — the phone's own
  // screenshot fixes it exactly once seen; until then the calibrated
  // camera crop stands in (a percent or two off).
  aspect: 0, aspectExact: false,
  sel: null,     // {bbox:[l,t,r,b], label} — the one selection both panes show
  hover: null,   // row index under the pointer, or null
  swipeArmed: false,  // Swipe pressed: the next drag on a pane is the stroke
  swipe: { sizes: {}, speeds: [] },  // the stroke ladder, served by /api/state
};
// Each pane's wrap and its overlay elements, resolved once.
const PANES = {};
for (const key of ["cam", "virt"]) {
  const wrap = $(key + "-wrap");
  PANES[key] = { wrap };
  for (const cls of ["hover", "sel", "drag", "arrow", "arrow-tag"])
    PANES[key][cls] = wrap.querySelector("." + cls);
}
const wraps = () => Object.values(PANES).map(p => p.wrap);
const VIEW_TOOLS = new Set(["peek", "screenshot"]);
const bboxText = bbox => "[" + bbox.map(v => v.toFixed(2)).join(", ") + "]";
const clamp01 = v => Math.min(1, Math.max(0, v));
const r3 = v => Math.round(v * 1000) / 1000;

// ---------- plumbing ----------

function banner(msg) {
  const b = $("banner");
  b.textContent = msg || "";
  b.style.display = msg ? "block" : "none";
}
$("banner").onclick = () => banner("");

function logEntry(text, cls) {
  const div = document.createElement("div");
  div.className = "entry" + (cls ? " " + cls : "");
  const t = document.createElement("time");
  t.textContent = new Date().toTimeString().slice(0, 8);
  div.append(t, text);
  $("log").prepend(div);
  while ($("log").children.length > 80) $("log").lastChild.remove();
}

function setBusy(what) {
  state.busy = !!what;
  $("busy").style.display = what ? "flex" : "none";
  $("busy-what").textContent = what || "";
  $("dot").classList.toggle("busy", state.busy);
  document.querySelectorAll("button").forEach(b => b.disabled = state.busy || b.dataset.unpublished === "1");
  renderActbar();
}

let connectedOnce = false;
function setConnected(on) {
  $("dot").classList.toggle("on", on);
  $("conn-label").textContent = on ? "connected" : "not connected";
}

async function api(path, body) {
  const resp = await fetch(path, body === undefined ? undefined : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await resp.json().catch(() => ({ status: "error", message: "unreadable reply" }));
  return data;
}

// ---------- acting on the phone ----------

async function act(tool, args, label) {
  if (state.busy) return;
  setBusy(label || tool);
  banner("");
  try {
    const data = await api("/api/act", { tool, args: args || {} });
    if (data.status !== "ok") {
      banner(data.message || "request failed");
      logEntry((label || tool) + " — " + (data.message || "failed"), "err");
      refreshState();
      return;
    }
    if (!connectedOnce) { connectedOnce = true; refreshState(); }
    logEntry(data.text || (label || tool), data.text ? "" : "dim");
    // A gesture acted on the selection; the new screen starts clean. A
    // view (peek, screenshot) re-reads the same screen and keeps it.
    if (data.image && !VIEW_TOOLS.has(tool)) state.sel = null;
    if (data.image) renderView(data);
  } catch (e) {
    banner("studio server unreachable: " + e.message);
  } finally {
    setBusy(null);
  }
}

// ---------- rendering the panes ----------

function renderView(data) {
  const img = $("frame"), exact = data.tool === "screenshot";
  img.onload = () => {
    const ar = img.naturalWidth / img.naturalHeight;
    if (exact) { state.aspect = ar; state.aspectExact = true; }
    else if (!state.aspectExact) state.aspect = ar;
    layout();
  };
  img.src = "data:" + (data.image.mime_type || "image/jpeg") + ";base64," + data.image.data;
  state.rows = data.rows || [];
  state.hover = null;
  if (state.sel) state.sel.label = matchLabel(state.sel.bbox);
}

const BEZEL = 9;  // .device padding, each side

function fitted(stage) {
  // Aspect-fit inside the stage, bezel included; CSS max-height can't
  // do this under an auto-height wrapper, so both panes size
  // explicitly from one rule.
  const ar = state.aspect;
  let w = stage.clientWidth - 2 * BEZEL, h = w / ar;
  const maxH = stage.clientHeight - 2 * BEZEL;
  if (h > maxH) { h = maxH; w = h * ar; }
  return [Math.floor(w), Math.floor(h)];
}

function layout() {
  if (!state.aspect) return;
  $("count").textContent = state.rows.length + " element" + (state.rows.length === 1 ? "" : "s")
    + " · screen 9:" + (9 / state.aspect).toFixed(1) + (state.aspectExact ? "" : " (camera crop)");
  for (const [key, pane] of Object.entries(PANES)) {
    const device = pane.wrap.parentElement;
    const [w, h] = fitted(device.parentElement);
    const surface = key === "cam" ? $("frame") : $("virt");
    surface.style.width = w + "px";
    surface.style.height = h + "px";
    device.style.display = "block";
  }
  $("cam-empty").style.display = "none";
  $("virt-empty").style.display = "none";
  renderVirt();
  renderOverlays();
}

function renderVirt() {
  const virt = $("virt");
  virt.innerHTML = "";
  const W = virt.clientWidth, H = virt.clientHeight;
  const spans = [];
  // Icons first, text on top: a label inside a boxed region must win.
  const ordered = [...state.rows].sort((a, b) => (a.kind === "text") - (b.kind === "text"));
  ordered.forEach(row => {
    const [l, t, r, b] = row.bbox;
    const w = Math.max(2, (r - l) * W), h = Math.max(2, (b - t) * H);
    const d = document.createElement("div");
    d.className = "el " + row.kind + (row.kind === "text" && row.conf < 0.6 ? " faint" : "");
    d.style.left = (l * W) + "px";
    d.style.top = (t * H) + "px";
    d.style.width = w + "px";
    d.style.height = h + "px";
    if (row.kind === "icon") {
      // App-icon-shaped boxes get the rounded-tile look; anything wide,
      // tall, or big is a region.
      const tile = w / h < 1.6 && h / w < 1.6 && (r - l) < 0.3 && (b - t) < 0.15;
      d.style.borderRadius = tile ? (Math.min(w, h) * 0.22) + "px" : "6px";
      if (!tile) d.classList.add("region");
    }
    if (row.kind === "text") {
      d.style.fontSize = Math.min(48, Math.max(6, (b - t) * H * 0.72)) + "px";
      const span = document.createElement("span");
      span.textContent = row.label;
      d.appendChild(span);
      spans.push(span);
    }
    virt.appendChild(d);
  });
  // Second pass: a label wider than its box is squeezed, never clipped —
  // the layout stays truthful to where the text sits on the phone.
  const squeeze = spans.map(span => [span, span.parentElement.clientWidth - 2, span.scrollWidth]);
  for (const [span, avail, width] of squeeze)
    if (width > avail && avail > 0) span.style.transform = "scaleX(" + (avail / width) + ")";
}

function place(box, bbox) {
  const wrap = box.parentElement, W = wrap.clientWidth, H = wrap.clientHeight;
  const [l, t, r, b] = bbox;
  box.style.left = (l * W) + "px";
  box.style.top = (t * H) + "px";
  box.style.width = ((r - l) * W) + "px";
  box.style.height = ((b - t) * H) + "px";
  box.style.display = "block";
}

function renderHover() {
  for (const pane of Object.values(PANES)) {
    if (state.hover !== null) place(pane.hover, state.rows[state.hover].bbox);
    else pane.hover.style.display = "none";
  }
}

function renderOverlays() {
  renderHover();
  for (const pane of Object.values(PANES)) {
    if (state.sel) place(pane.sel, state.sel.bbox); else pane.sel.style.display = "none";
  }
  renderActbar();
}

function renderActbar() {
  const bar = $("actbar"), on = !!state.sel;
  bar.classList.toggle("idle", !on);
  $("cap-label").textContent = on ? (state.sel.label || "box") : "no selection";
  $("cap-geo").textContent = on ? bboxText(state.sel.bbox) : "click an element or drag a box";
  bar.querySelectorAll("button").forEach(b => b.disabled = state.busy || !on);
  if (!on) state.swipeArmed = false;
  $("swipe-btn").classList.toggle("armed", state.swipeArmed);
  $("swipe-hint").textContent = state.swipeArmed ? "drag on the screen — the drag is the stroke" : "";
  for (const w of wraps()) w.style.cursor = state.swipeArmed ? "grab" : "crosshair";
}

function armSwipe(on) {
  if (!state.sel) return;
  state.swipeArmed = on;
  renderActbar();
}

// ---------- selecting: click an element, or drag a box ----------

function pointOf(ev, wrap) {
  const rect = wrap.getBoundingClientRect();
  return { x: clamp01((ev.clientX - rect.left) / rect.width),
           y: clamp01((ev.clientY - rect.top) / rect.height), px: ev.clientX, py: ev.clientY };
}

function rowAt(p) {
  // The smallest element containing the point — a word inside a card
  // wins over the card.
  let best = null, bestArea = Infinity;
  state.rows.forEach((row, i) => {
    const [l, t, r, b] = row.bbox;
    if (p.x < l || p.x > r || p.y < t || p.y > b) return;
    const area = (r - l) * (b - t);
    if (area < bestArea) { best = i; bestArea = area; }
  });
  return best;
}

function matchLabel(bbox) {
  // After a fresh view, keep the caption only if the same text still
  // sits in (roughly) the same box.
  const i = rowAt({ x: (bbox[0] + bbox[2]) / 2, y: (bbox[1] + bbox[3]) / 2 });
  if (i === null) return null;
  const [l, t, r, b] = state.rows[i].bbox;
  const near = Math.abs(l - bbox[0]) < 0.03 && Math.abs(t - bbox[1]) < 0.03
            && Math.abs(r - bbox[2]) < 0.03 && Math.abs(b - bbox[3]) < 0.03;
  return near ? state.rows[i].label : null;
}

function select(bbox, label) {
  state.sel = { bbox: bbox.map(r3), label: label || null };
  renderOverlays();
}

function clearSelection() {
  state.sel = null;
  renderOverlays();
}

// The stroke nearest to how far the box was dragged, as a fraction of
// the screen — the ladder is the swipe tool's own (`state.swipe.sizes`),
// so the arrow drawn is the stroke the arm makes.
function sizeFor(frac) {
  let best = null;
  for (const [size, dist] of Object.entries(state.swipe.sizes))
    if (best === null || Math.abs(dist - frac) < Math.abs(best[1] - frac)) best = [size, dist];
  return best || ["m", frac];
}

function swipeFrom(p, start) {
  // Direction is the dominant axis; length is the drag along it.
  const dx = p.x - start.x, dy = p.y - start.y;
  const horizontal = Math.abs(dx) > Math.abs(dy);
  const direction = horizontal ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  const [size, dist] = sizeFor(Math.abs(horizontal ? dx : dy));
  return { direction, size, dist, dx, dy, horizontal };
}

function showArrow(pane, sw) {
  const wrap = pane.wrap, W = wrap.clientWidth, H = wrap.clientHeight;
  const [l, t, r, b] = state.sel.bbox;
  const cx = (l + r) / 2 * W, cy = (t + b) / 2 * H;
  // The arrow is the stroke the arm will make, snapped to the ladder.
  const len = sw.dist * (sw.horizontal ? W : H);
  const angle = { right: 0, down: 90, left: 180, up: 270 }[sw.direction];
  const sign = (sw.direction === "right" || sw.direction === "down") ? 1 : -1;
  const arrow = pane.arrow, tag = pane["arrow-tag"];
  arrow.style.left = cx + "px"; arrow.style.top = (cy - 1.5) + "px";
  arrow.style.width = Math.max(0, len - 10) + "px";
  arrow.style.transform = "rotate(" + angle + "deg)";
  arrow.style.display = "block";
  tag.textContent = "swipe " + sw.direction + " · " + sw.size + " · " + Math.round(sw.dist * 100) + "%";
  // The tag rides beside the arrow, never over it.
  tag.style.left = (cx + (sw.horizontal ? sign * len / 2 : 76)) + "px";
  tag.style.top = (cy + (sw.horizontal ? -22 : sign * len / 2)) + "px";
  tag.style.display = "block";
}

function hideDragFeedback() {
  for (const pane of Object.values(PANES))
    for (const cls of ["drag", "arrow", "arrow-tag"]) pane[cls].style.display = "none";
}

let drag = null;
for (const [key, pane] of Object.entries(PANES)) {
  const wrap = pane.wrap;
  wrap.addEventListener("dragstart", ev => ev.preventDefault());
  wrap.addEventListener("pointerdown", ev => {
    if (state.busy || ev.button !== 0) return;
    ev.preventDefault();
    // With Swipe armed the drag is the stroke (from the selected box);
    // otherwise it draws a new box.
    drag = { pane: key, start: pointOf(ev, wrap), moved: false, swipe: state.swipeArmed };
    wrap.setPointerCapture(ev.pointerId);
  });
  wrap.addEventListener("pointermove", ev => {
    const p = pointOf(ev, wrap);
    if (drag && drag.pane === key) {
      if (!drag.moved && Math.hypot(p.px - drag.start.px, p.py - drag.start.py) < 6) return;
      drag.moved = true;
      if (drag.swipe) { showArrow(pane, swipeFrom(p, drag.start)); return; }
      const bbox = [Math.min(drag.start.x, p.x), Math.min(drag.start.y, p.y),
                    Math.max(drag.start.x, p.x), Math.max(drag.start.y, p.y)];
      for (const q of Object.values(PANES)) place(q.drag, bbox);
      return;
    }
    const i = state.busy || state.swipeArmed ? null : rowAt(p);
    if (i !== state.hover) { state.hover = i; renderHover(); }
  });
  wrap.addEventListener("pointerleave", () => {
    if (state.hover !== null) { state.hover = null; renderHover(); }
  });
  wrap.addEventListener("pointerup", ev => {
    if (!drag || drag.pane !== key) return;
    const d = drag; drag = null;
    hideDragFeedback();
    if (state.busy) return;
    const p = pointOf(ev, wrap);
    if (d.swipe) {
      // Armed: a real drag is the stroke; a mere click leaves it armed.
      if (d.moved) { const sw = swipeFrom(p, d.start); armSwipe(false); swipe(sw.direction, sw.size); }
      return;
    }
    if (d.moved) {
      select([Math.min(d.start.x, p.x), Math.min(d.start.y, p.y),
              Math.max(d.start.x, p.x), Math.max(d.start.y, p.y)]);
      return;
    }
    // A click lands on an element or nowhere: no box for empty space.
    const i = rowAt(d.start);
    if (i !== null) select(state.rows[i].bbox, state.rows[i].label);
    else clearSelection();
  });
}

// ---------- the action bar ----------

function selName() {
  return state.sel.label ? "“" + state.sel.label + "”" : bboxText(state.sel.bbox);
}

function press(tool) {
  if (!state.sel) return;
  act(tool, { bbox: state.sel.bbox }, tool.replace("_", " ") + " " + selName());
}

function swipe(direction, size) {
  if (!state.sel) return;
  const speed = $("swipe-speed").value;
  act("swipe", { bbox: state.sel.bbox, direction, size, speed },
      "swipe " + direction + " from " + selName() + " (" + size + ", " + speed + ")");
}

// The press buttons' keycaps are their hotkeys — spelled once, in the markup.
const PRESS_KEYS = {};
document.querySelectorAll("#actbar [data-press]").forEach(b => {
  b.onclick = () => press(b.dataset.press);
  PRESS_KEYS[b.querySelector("kbd").textContent.toLowerCase()] = b.dataset.press;
});
$("swipe-btn").onclick = () => armSwipe(!state.swipeArmed);
$("cap-x").onclick = clearSelection;

document.querySelectorAll("header button[data-tool]").forEach(btn => {
  btn.onclick = () => act(btn.dataset.tool, {}, btn.textContent.trim());
});

$("clip").onsubmit = ev => {
  ev.preventDefault();
  const text = $("clip-text").value;
  if (!text) return;
  act("send_to_clipboard", { text }, "clipboard ← " + JSON.stringify(text));
};

const ARROWS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
window.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT" || ev.metaKey || ev.ctrlKey) return;
  if (ev.key === "Escape") {
    if (drag) { drag = null; hideDragFeedback(); }
    else if (state.swipeArmed) armSwipe(false);
    else clearSelection();
    return;
  }
  if (state.busy) return;
  const k = ev.key.toLowerCase();
  if (k === "p") act("peek", {}, "peek");
  else if (PRESS_KEYS[k]) press(PRESS_KEYS[k]);
  else if (k === "s") armSwipe(!state.swipeArmed);
  else if (ARROWS[ev.key] && state.sel) { ev.preventDefault(); swipe(ARROWS[ev.key], "m"); }
});

// ---------- session ----------

async function refreshState() {
  try {
    const s = await api("/api/state");
    setConnected(s.connected);
    $("conn").title = s.mcp_url;
    if (s.swipe) {
      state.swipe = s.swipe;
      const sel = $("swipe-speed"), keep = sel.value;
      sel.innerHTML = "";
      for (const sp of s.swipe.speeds) sel.appendChild(new Option(sp, sp, false, sp === (keep || "medium")));
    }
    // A session publishes its surface once connected; grey out the rest.
    if (s.tools && s.tools.length)
      document.querySelectorAll("header [data-tool]").forEach(b => {
        const off = !s.tools.includes(b.dataset.tool);
        b.dataset.unpublished = off ? "1" : "0";
        b.disabled = off;
        b.title = off ? "not published by this session" : b.title;
      });
  } catch (e) {
    setConnected(false);
    banner("studio server unreachable: " + e.message);
  }
}

let resizeQueued = false;
window.addEventListener("resize", () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; layout(); });
});
refreshState().then(() => act("peek", {}, "peek")).then(() => {
  if (!state.aspect) $("cam-empty").innerHTML = "No view yet — press <kbd>Peek</kbd>.";
});
</script>
</body>
</html>
