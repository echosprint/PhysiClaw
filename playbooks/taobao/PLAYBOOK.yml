# The pack spec — ONE file, read top-down: meta, then the walk as a
# ROUTE (page → do → page → decide … ask … page), then `pages:` for
# the fingerprints no move lands on. Every hand is embedded in the
# move that runs it, so nothing lives beside this file.
app: taobao
description: >-
  Buy one item on 淘宝 (Taobao) by keyword, deterministically — search →
  pick by criteria → buy sheet → human payment gate → pay. Adopt for
  淘宝 purchases without freeform driving.

placeholders:
  CONTACT:
    description: the IM contact name of YOUR user thread, exactly as the chat app shows it
    example: QiaoQian

landmarks:
  back:
    label: "back chevron (top-left)"     # an icon — no on-screen text
    bbox: [0.015, 0.045, 0.095, 0.095]
  dismiss:
    label: "scrim above a bottom sheet"  # below the IM-banner zone (y < 0.15)
    bbox: [0.35, 0.16, 0.65, 0.24]
  cart:
    label: "购物车"                       # detail-page bottom bar, third icon —
    bbox: [0.231, 0.898, 0.346, 0.954]   # measured live on the detail footer
  confirm:
    label: "确定"                         # a sheet's full-width bottom confirm —
    bbox: [0.06, 0.910, 0.94, 0.955]     # UNRECORDED estimate, heals by text

playbooks:
  buy:
    description: buy one item on Taobao by keyword
    enabled: false  # rehearse on YOUR device, then enable
    inputs:
      user_said:
        description: what the user said, verbatim — the original message the task came from
        example: "帮我在淘宝买一袋五常大米，5kg装的"

    # The walk. `page:` is where the walk must BE (checked every time);
    # everything else is a move, landing on the page that follows it.
    route:
      # An agent step with no tools is a pure-text call: prompt in,
      # declared fields out, no screen — it runs before the arm ever
      # moves, so a message that yields no keyword escalates before the
      # phone is touched. Outputs are referenced as {parse.keyword}.
      - agent: parse
        prompt: |
          From the buyer's message, produce the Taobao search keyword.
          The buyer said: "{inputs.user_said}"
          Rules:
          - a pure product keyword: name + spec (e.g. 五常大米 5kg)
          - no quantity words (一袋/两盒), no verbs, no politeness
          - keep the language the buyer used
          If the message names no concrete product, answer escalate.
        returns:
          keyword: the search keyword, exactly as it should be typed

      - start: app                    # ── START: cold-launch taobao ─────
        macro:
          steps:
            - name: force-quit        # ALWAYS cold: a resumed app would land
              tool: force_quit        # mid-state and fail the settle expect
            - name: go-home
              tool: home_screen
            - name: dismiss-switcher  # home_screen FROM home can open the switcher
              tool: tap
              with: {label: "blank area below the app cards", bbox: [0.42, 0.855, 0.58, 0.885]}
            - name: open-taobao
              tool: tap
              with: {label: "the taobao app icon", bbox: [0.720, 0.425, 0.909, 0.551]}
            - name: cold-launch
              tool: wait
              with: {seconds: 5}
            - name: skip-splash       # a cold launch may open on a full-screen
              tool: tap               # ad — without this guard every relaunch
              with: {label: "跳过", bbox: [0.79, 0.030, 0.87, 0.065]}   # fails verify
              skip_when: {not: {text: "跳过", within: [0.70, 0.0, 1.0, 0.12]}}
            - name: settle            # `expect` re-peeks AFTER the sleep — THIS
              tool: wait              # fresh view is what the home verify reads
              with: {seconds: 4}      # (a tap's own view is grabbed mid-launch;
              expect: "推荐"           # a post-ad cold render needs the slack)

      - page: home                    # the landing the start must reach
        anchors: {or: ["推荐", "关注"], region: top}
        recover:                      # not this page → run this hand, then
          tool: force_quit            # walk again from the route top (start
                                      # re-runs); declared, not a hidden
                                      # ladder — what you write is what runs

      - do: search                    # type the keyword, run the search
        with: {keyword: "{parse.keyword} 非直播"}  # suffix the search, not the field
        macro:
          inputs:
            keyword: {description: what to search for}
          steps:
            - name: tap-search-bar    # only ever tapped ON the home feed —
              tool: tap               # the start contract guarantees it
              with: {label: "home-feed search bar", bbox: [0.30, 0.092, 0.70, 0.128]}
            - name: clip
              tool: send_to_clipboard
              with: {text: "{keyword}"}
            - name: hold-field
              tool: long_press
              with: {label: "search input field", bbox: [0.08, 0.115, 0.55, 0.148]}
            - name: paste             # en system — the iOS menu bubble reads Paste
              tool: tap
              with: {label: "Paste", bbox: [0.066, 0.070, 0.163, 0.098]}
            - name: go-search
              tool: tap
              with: {label: "搜索", bbox: [0.811, 0.865, 0.923, 0.895]}
            - name: load
              tool: wait
              with: {seconds: 2}
            - name: close-vip-overlay # post-search coupon promo covers results
              tool: tap
              with: {label: "close (X) on the coupon overlay", bbox: [0.858, 0.069, 0.901, 0.104]}
              skip_when: {not: {or: ["确认领取", "消费券", "马上去用"]}}

      - page: results
        anchors: {and: ["综合", "销量"]}
        scrollable: true
        recover:                      # a promo page or mis-tap → pop it
          tool: go_back               # the edge swipe — the chevron tap misses

      # A custom sub-agent: YOUR prompt drives the LLM through the pick.
      # `prompt` is filled from fields ONCE when the episode opens, then
      # frozen; each call appends one [action]/[screen] pair and nothing
      # is ever rewritten — every call's prefix is byte-identical to the
      # previous call's whole request, so the provider cache pays for
      # all but the newest block. Screens arrive as element listings
      # (text rows with ids, no images); the model answers with a row
      # id, a granted landmark, or a verb (scroll / done / escalate) —
      # never coordinates. The walker grounds the name to a live bbox.
      - agent: pick-into-cart
        prompt: |
          You are buying ONE item for the buyer on Taobao, from search
          results to an audited cart. Work in stages:
          1. PICK — browse the results. Prefer a single-pack item whose
             spec matches the keyword exactly (no bundles), high sales,
             low price; 百亿补贴 first. Open a listing to inspect its
             detail page; use go_back to return and keep comparing.
             Compare at least two listings. NEVER tap coupon or promo
             buttons (领券, 领取, 马上去用) — they leave the results.
          2. ADD — add the chosen item to the cart (加入购物车). If a
             spec sheet opens, pick the spec matching the keyword, set
             the quantity, and confirm (the granted `confirm` landmark).
          3. CART — open the cart (answer the granted `cart` landmark
             from a listing's detail page) and audit it: the item you just added is ticked
             (round toggle at the row's left edge); untick every other
             line — they may be the buyer's own saved items, never
             remove or delete anything. The spec and quantity match the
             ask (+/- steppers flank the quantity numeral). Read the
             total (合计) for the ticked items.
          The buyer said: "{inputs.user_said}"
          Search keyword: {parse.keyword}
          When the cart is exactly right, answer done and return the
          fields, standing on the cart page. If nothing fits, the added
          item is missing from the cart, or the cart cannot be fixed by
          ticking and steppers, answer escalate.
        tools: [tap, scroll, back]    # closed allowlist for this episode
        give: [landmarks.cart, landmarks.confirm]        # known spots the model may name
        returns:
          summary: one line per ticked item - title, spec, qty, price
          total: the 合计 amount for the ticked items, digits only
          message: a short Chinese message asking the buyer to confirm
            this purchase - name the item, spec, qty and total
        limit: {calls: 24, scrolls: 10}

      - page: cart
        anchors: {and: ["购物车", "结算"]}
        scrollable: true
        recover:
          tool: go_back

      - ask: confirm-pay              # the human approves before money moves
        approve: payment
        message: "{pick-into-cart.message}（实付以屏幕读数为准：¥{ask.total}）回复 好的 确认支付，或 不用 取消。"
        resume:                       # the ask left the app — come back
          macro:
            steps:
              - name: go-home
                tool: home_screen
              - name: dismiss-switcher
                tool: tap
                with: {label: "blank area below the app cards", bbox: [0.42, 0.855, 0.58, 0.885]}
              - name: open-taobao
                tool: tap
                with: {label: "the taobao app icon", bbox: [0.720, 0.425, 0.909, 0.551]}
              - name: settle
                tool: wait
                with: {seconds: 2}

      # Payment as a fenced episode: the human already consented to
      # ¥{ask.total}, so the model only NAVIGATES the checkout — the
      # walker re-runs the money predicates before EVERY tap proposed
      # here, and a tap while no visible amount equals the consented
      # total (or with any amount above it) is refused → escalate.
      - agent: pay
        irreversible: payment
        prompt: |
          The buyer has approved this purchase at ¥{ask.total}.
          Complete the checkout from the cart:
          - tap 结算; on the order page, confirm the total equals
            ¥{ask.total}, then tap 提交订单
          - on the payment sheet, keep the default payment method and
            tap 立即支付 or 确认支付
          Do not change the address, coupons, or anything else. If the
          total differs from ¥{ask.total}, or a password or verification
          is requested, answer escalate.
        tools: [tap]
        limit: {calls: 8}

      - page: paid
        anchors: "支付成功"

