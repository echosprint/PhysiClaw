# The pack spec — ONE file, read top-down: meta, then the walk as a
# ROUTE (page → do → page → decide … ask … page), then `pages:` for
# the fingerprints no move lands on. Every hand is embedded in the
# move that runs it, so nothing lives beside this file.
app: taobao
description: >-
  Buy one item on 淘宝 (Taobao) by keyword, deterministically — search →
  pick by criteria → buy sheet → human payment gate → pay. Adopt for
  淘宝 purchases without freeform driving.

placeholders:
  CONTACT:
    description: the IM contact name of YOUR user thread, exactly as the chat app shows it
    example: QiaoQian

# App chrome the author KNOWS sits at a fixed place — prior knowledge
# the rescue ladder spends before the model is woken. `back` replaces
# the generic go_back gesture on the back rung (located by its label
# live when readable); `dismiss` is the scrim area sheets and modals
# close from, tapped only when it lies OUTSIDE the detected overlay.
# Verify both positions at rehearsal like any recorded coordinate.
controls:
  back:
    label: "back chevron (top-left)"     # an icon — no on-screen text
    bbox: [0.015, 0.045, 0.095, 0.095]
  dismiss:
    label: "scrim above a bottom sheet"  # below the IM-banner zone (y < 0.15)
    bbox: [0.35, 0.16, 0.65, 0.24]

playbooks:
  buy:
    description: 淘宝按关键词买一件东西
    enabled: false  # rehearse on YOUR device, then enable
    inputs:
      keyword:
        description: 纯商品搜索关键词（品名+规格；不含数量词，如“一袋/两盒”）
        example: "五常大米 5kg"
      criteria:
        description: 挑选标准
        default: "单件装且规格与搜索词一致（不要多件套装/组合装），标题带百亿补贴的，销量高、价格便宜的"
      cap:
        description: 预算上限（元）
        default: "50"
    budget: "{inputs.cap}"

    # The walk. `page:` is where the walk must BE (checked every time);
    # everything else is a move, landing on the page that follows it.
    route:
      - page: home                    # ── START ─────────────────────────
        anchors:                      # not on home at wake → init ladder:
          - {text: "推荐", region: top}    # go_back ×2, then force_quit and
          - {text: "关注", region: top}    # `open` below, until home reads
        open:                         # cold-launch taobao to this page
          steps:
            - name: go-home
              tool: home_screen
            - name: dismiss-switcher  # home_screen FROM home can open the switcher
              tool: tap
              with: {label: "blank area below the app cards", bbox: [0.42, 0.855, 0.58, 0.885]}
            - name: open-taobao
              tool: tap
              with: {label: "淘宝", bbox: [0.720, 0.425, 0.909, 0.551]}
            - name: cold-launch
              tool: wait
              with: {seconds: 5}
            - name: skip-splash       # a cold launch may open on a full-screen ad
              tool: tap
              with: {label: "跳过", bbox: [0.79, 0.030, 0.87, 0.065]}
              skip_when: {not: {text: "跳过", within: [0.70, 0.0, 1.0, 0.12]}}
            - name: dismiss-banner    # an incoming-IM banner hijacks top taps
              tool: swipe
              with: {label: "the notification banner", bbox: [0.30, 0.03, 0.70, 0.08], direction: "up", size: "s"}
              skip_when: {not: {text: "<<CONTACT>>", within: [0.0, 0.0, 1.0, 0.15]}}

      - do: search                    # type the keyword, run the search
        with: {keyword: "{inputs.keyword}"}
        macro:
          inputs:
            keyword: {description: what to search for}
          steps:
            - name: tap-search-bar    # only ever tapped ON the home feed —
              tool: tap               # the start contract guarantees it
              with: {label: "home-feed search bar", bbox: [0.30, 0.092, 0.70, 0.128]}
            - name: clip
              tool: send_to_clipboard
              with: {text: "{keyword}"}
            - name: hold-field
              tool: long_press
              with: {label: "search input field", bbox: [0.08, 0.115, 0.55, 0.148]}
            - name: paste             # en system — the iOS menu bubble reads Paste
              tool: tap
              with: {label: "Paste", bbox: [0.066, 0.070, 0.163, 0.098]}
            - name: go-search
              tool: tap
              with: {label: "搜索", bbox: [0.811, 0.865, 0.923, 0.895]}
            - name: load
              tool: wait
              with: {seconds: 2}
            - name: close-vip-overlay # post-search 88VIP/coupon promo covers results
              tool: tap
              with: {label: "close (X) on the coupon overlay", bbox: [0.858, 0.069, 0.901, 0.104]}
              skip_when: {not: {or: ["确认领取", "消费券"]}}

      - page: results
        anchors: ["综合", "销量"]
        scrollable: true

      - decide: choose                # pick the item per criteria
        uses: choose_item
        with: {criteria: "{inputs.criteria}"}
        context: [inputs.keyword]
        routes: {pick: detail, scroll: choose, none_fit: escalate, escalate: escalate}

      - page: detail
        # 百亿补贴 items label the buy button 领券购买, plain items 立即购买
        # — alt readings of one anchor. `forbid: 有货` kills the SKU-sheet
        # lookalike, whose bottom bar can carry the same buttons.
        anchors:
          - {text: "加入购物车", region: bottom}
          - {text: ["领券购买", "立即购买"], region: bottom}
        forbid: ["有货"]

      - do: buysheet                  # open the buy sheet
        macro:
          steps:
            - name: buy-button        # one target, two spellings (百亿补贴 vs plain)
              tool: tap
              with: {label: ["领券购买", "立即购买"], bbox: [0.66, 0.905, 0.93, 0.945]}
            - name: settle            # the sheet animates in and lazy-loads its
              tool: wait              # rows; `expect` re-peeks AFTER the sleep, so
              with: {seconds: 3}      # it waits out the render and fails loudly
              expect: "实付"           # if no payment sheet opened

      - page: paysheet
        anchors: ["实付", "订单备注"]

      - ask: confirm-pay              # the human approves before money moves
        approve: payment
        message: "「买{inputs.keyword}」已选好，实付合计 ¥{ask.total}。回复 好的 确认支付，或 不用 取消。"
        over_budget_message: "「买{inputs.keyword}」实付合计 ¥{ask.total}，已超出预算 ¥{ask.cap}。回复 好的 确认支付，或 不用 取消。"
        return:                       # the ask left the app — come back
          steps:
            - name: go-home
              tool: home_screen
            - name: dismiss-switcher
              tool: tap
              with: {label: "blank area below the app cards", bbox: [0.42, 0.855, 0.58, 0.885]}
            - name: open-taobao
              tool: tap
              with: {label: "淘宝", bbox: [0.720, 0.425, 0.909, 0.551]}
            - name: settle
              tool: wait
              with: {seconds: 2}

      - do: pay
        irreversible: payment
        macro:
          steps:
            - name: pay-button
              tool: tap
              with: {label: ["立即支付", "确认支付"], bbox: [0.39, 0.915, 0.69, 0.958]}
            - name: settle
              tool: wait
              with: {seconds: 4}

      - page: paid
        anchors: ["支付成功"]

# Pages OFF the route — hand-over contexts and lookalike fences the
# matcher must know but no move lands on deliberately.
pages:
  skusheet:
    # The spec-choosing overlay; the buy walk hands over here (choosing
    # a spec beyond the pick is the model's job). NOT "有货": 2-char
    # anchors ride the one-substitution window, and 有货 ≈ 退货(宝)
    # would fake this page onto the payment sheet. `forbid: 订单备注`
    # is the structural kill: only the payment sheet carries it.
    anchors:
      - "规格"
      - {text: ["加入购物车", "确定", "立即购买"], region: bottom}
    forbid: ["订单备注"]

# Adapting to your device
# - Gesture coordinates were recorded on the authoring device (iPhone,
#   zh apps / en system). Same model usually replays as-is; rehearse
#   and re-record the steps that miss.
# - Page anchors were measured on 百亿补贴 listings (the buy button
#   reads 领券购买 there, 立即购买 elsewhere — both declared). Verify:
#   `physiclaw conductor match taobao --live` on each page, then
#   `calibrate` to learn geometry.
#
# Rehearse, then enable
#   physiclaw playbooks run taobao/buy --input "keyword=五常大米 5kg"
# Walk it to the gate at least once (reply 不用 to back out without
# paying) before flipping `enabled: true` here — the one switch gates
# every embedded macro too.
