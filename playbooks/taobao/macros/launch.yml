name: launch
description: cold-launch Taobao from wherever the phone is — every route's start
# Disabled until rehearsed on YOUR device: physiclaw macros run taobao/launch
enabled: false
steps:
  # ALWAYS cold: a resumed app lands mid-state (a stale search,
  # a detail page) and fails the settle expect. force_quit kills
  # the FOREGROUND app, and the boot leaves the IM app there —
  # so bring taobao to the front first, then kill it.
  - home_screen
  - tap: "blank area below the app cards"    # home_screen FROM home can open the switcher
    at: [0.42, 0.855, 0.58, 0.885]
  - tap: "the taobao app icon"               # foreground it in whatever state it kept
    at: [0.720, 0.425, 0.909, 0.551]
  - wait: 2
  - force_quit                               # now the card the switcher flings is taobao's
  - home_screen
  - tap: "blank area below the app cards"
    at: [0.42, 0.855, 0.58, 0.885]
  - tap: "the taobao app icon"               # the cold launch
    at: [0.720, 0.425, 0.909, 0.551]
  - wait: 5
  # A cold launch may open on a full-screen ad — without this step
  # every relaunch fails verify. `when` runs it only while 跳过 shows.
  - tap: "跳过"
    at: [0.79, 0.030, 0.87, 0.065]
    when: {text: "跳过", within: [0.70, 0.0, 1.0, 0.12]}
  # `expect` re-peeks AFTER the sleep — THIS fresh view is what the home
  # verify reads (a tap's own view is grabbed mid-launch; a post-ad cold
  # render needs the slack).
  - wait: 4
    expect: "推荐"
