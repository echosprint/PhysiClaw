name: send
description: open the <<CONTACT>> WeChat thread via in-app search and send {message}
enabled: false
inputs:
  message:
    description: the text to send to the user
steps:
  - home_screen
  - wait: 1
  - tap: "blank area below the app cards"    # home_screen FROM home can open the app switcher
    at: [0.42, 0.855, 0.58, 0.885]
  - tap: "the WeChat dock icon"
    at: [0.348, 0.893, 0.510, 0.973]
  - wait: 2
  - go_back                                  # in a thread -> pops to the chat list; on the list -> harmless edge bounce
  # Search is position-independent: the chat list reorders itself
  # (Official Accounts folder, new chats), so never tap a list row blind.
  - tap: "Search"
    at: [0.30, 0.098, 0.65, 0.132]
  - send_to_clipboard: "<<CONTACT>>"
  - long_press: "the search input field"
    at: [0.15, 0.063, 0.60, 0.100]
  - tap: "Paste"
    at: [0.036, 0.114, 0.197, 0.162]
  - wait: 1
  # Only the row being tapped matters: section headers (Top Hits /
  # Contacts / 联系人) shuffle with search history, but the first result
  # stays in this band - and it must BE the contact.
  - tap: "<<CONTACT>>"                        # first row under the Contacts header
    at: [0.031, 0.185, 0.900, 0.235]
    require: {text: "<<CONTACT>>", within: [0.0, 0.16, 1.0, 0.25]}
    hint: "WeChat search's first result is not <<CONTACT>> - check the contact name"
  - tap: "the message input box (keyboard down)"   # NEVER type into an unverified chat
    at: [0.15, 0.925, 0.60, 0.965]
    require: {text: "<<CONTACT>>", within: [0.20, 0.03, 0.80, 0.10]}
    hint: "not on the <<CONTACT>> thread - refusing to type into the wrong chat"
  - send_to_clipboard: "{message}"
  - long_press: "the message input box (keyboard up)"   # the field sits above the keyboard
    at: [0.10, 0.585, 0.45, 0.625]
  - tap: "Paste"
    at: [0.122, 0.545, 0.214, 0.572]
  - tap: "Send"
    at: [0.822, 0.865, 0.912, 0.893]
